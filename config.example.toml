# net-sentry configuration
# Lives at: ~/Library/Application Support/net-sentry/config.toml
# Edits require: launchctl kickstart -k gui/$(id -u)/link.smirnov.net-sentry

[debounce]
seconds = 2.0

[notifiers.speech]
enabled = true
voice = "Samantha"            # `say -v ?` for the full list
text_down = "Internet is down"
text_up = ""                  # empty = skip recovery direction

[notifiers.modal]
enabled = true
icon = "stop"                 # stop | caution | note
timeout_seconds = 30          # auto-dismiss; 0 = block forever
text_down = "Internet is down"
text_up = ""

[notifiers.banner]
enabled = true
title = "Net Sentry"
text_down = "Internet is down"
text_up = "Internet is back"

# --- DNS Guard (optional) ---------------------------------------------------
# Clears a pinned DNS override when the configured resolver stops answering
# (e.g. your Pi-hole when its WireGuard tunnel drops), and re-pins it on
# recovery. Off by default. Detection is a one-shot TCP:53 probe fired on
# network-change events — not polling.
[dns_guard]
enabled = false
known_dns = "10.0.0.2"        # the resolver IP to probe and manage (set to YOUR Pi-hole)
services = ["Wi-Fi"]          # network service(s) whose DNS override to own
debounce_seconds = 3.0        # settle time before acting (rides out VPN reconnect flaps)
probe_timeout_seconds = 2.0   # TCP:53 probe deadline; miss => treat as unreachable
notify = true                 # banner when it clears / restores
